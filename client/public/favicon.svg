<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#050505" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <g transform="translate(1, 0)">
    <!-- T (serif) -->
    <text x="7" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="300" fill="url(#tGrad)">T</text>
    <!-- Q (monospace) -->
    <text x="15" y="22" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="300" fill="url(#qGrad)" opacity="0.95">Q</text>
  </g>
</svg>
